[package]
name = "aipura-score-sim"
version = "0.1.0"
description = "アイプラ ライブスコア シミュレータ（デスクトップアプリ版）"
edition = "2021"

# Tauri 2 の標準スキャフォールド（デスクトップのみ使用）
[lib]
name = "aipura_score_sim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
